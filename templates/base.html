<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MONKEY{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<div class="layout-wrapper">
    {% if current_user.is_authenticated %}
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="{{ url_for('me') }}" class="user-profile-link" aria-label="My Profile">
                <div class="user-avatar">
                   <img src="{{ url_for('static', filename='profile_pics/' + current_user.profile_image) }}" 
                        alt="Profile"
                        onerror="this.src='https://ui-avatars.com/api/?name={{ current_user.first_name }}+{{ current_user.last_name }}&background=random'">
                </div>
            </a>
        </div>
        
        <nav class="sidebar-nav">
            <a href="{{ url_for('index') }}" class="nav-item active">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </span>
                <span class="label">Calendar</span>
            </a>
            
            <a href="{{ url_for('friends') }}" class="nav-item">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </span>
                <span class="label">Friends</span>
            </a>

            <a href="{{ url_for('groups') }}" class="nav-item">
                <span class="icon">
                     <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </span>
                <span class="label">Groups</span>
            </a>

            <a href="{{ url_for('classes') }}" class="nav-item">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </span>
                <span class="label">Classes</span>
            </a>

            <div class="nav-item placeholder" title="Coming soon">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </span>
                <span class="label">Add Class</span>
            </div>
        </nav>
    </aside>
    {% endif %}

    <!-- ===== Page-specific content goes here ===== -->
    <main class="main-content {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    
    {% block right_sidebar %}{% endblock %}
</div>

</body>
</html>
