<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Week Calendar Prototype (M–F) — 7 People Example (Fixed)</title>
  <style>
    :root{
      --sidebar: 72px;
      --hour-height: 80px; /* px per hour, adjust scale */
      --day-start: 7; /* visible start hour */
      --day-end: 21; /* visible end hour */
      --hours: calc(var(--day-end) - var(--day-start));
      --grid-height: calc(var(--hours) * var(--hour-height));
      --card-radius: 10px;
      --muted: #9aa4b2;
      --bg: linear-gradient(180deg,#f6f9fc,#eef5fb);
      --track-gap: 6px;
    }

    *{box-sizing:border-box;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    html,body{height:100%;margin:0;background:var(--bg);color:#15202b}

    .wrap{max-width:1200px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;gap:18px;margin-bottom:18px}
    .title{font-size:20px;font-weight:700}
    .sub{color:var(--muted);font-size:13px}

    .panel{display:grid;grid-template-columns:var(--sidebar) 1fr;gap:18px;background:rgba(255,255,255,0.7);padding:16px;border-radius:14px;box-shadow:0 6px 30px rgba(14,30,37,0.08)}

    /* left sidebar (times + people legend) */
    .sidebar{padding-right:8px}
    .time-column{position:relative;height:var(--grid-height);border-right:1px dashed rgba(20,30,40,0.06)}
    .time-label{height:var(--hour-height);display:flex;align-items:flex-start;padding-top:6px;padding-left:8px;color:var(--muted);font-size:13px}

    .legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
    .person-chip{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:rgba(20,30,40,0.03);font-size:13px}
    .dot{width:12px;height:12px;border-radius:3px}

    /* main grid */
    .main{overflow:auto}
    .week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .day{background:transparent;border-radius:10px;padding:10px 8px}
    .day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .day-name{font-weight:600}
    .day-sub{font-size:12px;color:var(--muted)}

    .day-body{position:relative;height:var(--grid-height);background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));border-radius:10px;padding:6px;border:1px solid rgba(14,30,37,0.03);overflow:hidden}

    /* horizontal hour lines */
    .hour-line{position:absolute;left:0;right:0;height:1px;background:rgba(20,30,40,0.04)}
    .hour-line .label{position:absolute;left:6px;top:-9px;font-size:11px;color:var(--muted)}

    /* tracks: use grid to evenly divide into 7 tracks for 7 people */
    .tracks{
      position:absolute;
      left:0; right:0; top:0; bottom:0;
      display:grid;
      grid-template-rows: repeat(7, 1fr);
      gap: var(--track-gap);
      padding:6px;
      pointer-events:none; /* let events control pointer events */
    }
    .track{
      position:relative;
      pointer-events:auto; /* allow interaction on events inside */
      overflow:visible;
    }

    /* events are absolutely positioned inside track */
    .event{
      position:absolute;
      left:6px;
      right:6px;
      padding:8px 10px;
      border-radius:8px;
      box-shadow:0 6px 18px rgba(20,30,40,0.08);
      color:white;font-weight:600;font-size:13px;overflow:hidden;display:flex;flex-direction:column;gap:6px;
      line-height:1.1;
      z-index:10;
      display:block;
    }
    .event .meta{font-size:12px;opacity:0.95;font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}

    /* color palette for 7 people */
    .p0{background:linear-gradient(135deg,#6c5ce7,#4a47e7)}
    .p1{background:linear-gradient(135deg,#ff7b7b,#ff5a9e)}
    .p2{background:linear-gradient(135deg,#00c6ff,#0072ff)}
    .p3{background:linear-gradient(135deg,#5ee7a8,#2bd199)}
    .p4{background:linear-gradient(135deg,#ffd166,#ff9f1c)}
    .p5{background:linear-gradient(135deg,#a29bfe,#7e7af6)}
    .p6{background:linear-gradient(135deg,#ffa3e0,#ff6fbf)}

    /* ensure overlapping events stack visually with slight offsets */
    .event.offset-1{transform: translateX(6px); box-shadow:0 8px 20px rgba(20,30,40,0.10)}
    .event.offset-2{transform: translateX(-6px); box-shadow:0 8px 20px rgba(20,30,40,0.10)}

    /* small responsive tweaks */
    @media (max-width:900px){.wrap{padding:12px}.panel{grid-template-columns:56px 1fr}}
    @media (max-width:640px){.week{grid-template-columns:repeat(1,1fr)} .sidebar{display:none}}

    /* controls */
    .controls{display:flex;gap:8px;margin-left:auto}
    .btn{padding:8px 12px;border-radius:10px;background:white;border:1px solid rgba(14,30,37,0.06);box-shadow:0 4px 14px rgba(14,30,37,0.03);cursor:pointer}

    .note{margin-top:12px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="title">Week View — M to F</div>
        <div class="sub">Prototype showing 7 people with overlapping/interweaving events on the same day</div>
      </div>
      <div class="controls">
        <button class="btn">Today</button>
        <button class="btn">Prev</button>
        <button class="btn">Next</button>
      </div>
    </header>

    <div class="panel">
      <aside class="sidebar">
        <div style="font-weight:700;margin-bottom:8px">Time</div>
        <div class="time-column" id="time-column"></div>

        <div style="font-weight:700;margin-top:14px">People</div>
        <div class="legend" id="legend"></div>
      </aside>

      <main class="main">
        <div class="week" id="week"></div>
        <div class="note">Each horizontal track corresponds to one person. When many people are busy at the same time you’ll see vertical alignment across tracks.</div>
      </main>
    </div>
  </div>

  <script>
    /* Configuration */
    const people = [
      {id:0, name:'Alex'},
      {id:1, name:'Bianca'},
      {id:2, name:'Carlos'},
      {id:3, name:'Dana'},
      {id:4, name:'Eli'},
      {id:5, name:'Fatima'},
      {id:6, name:'George'}
    ];

    const days = ['Mon','Tue','Wed','Thu','Fri'];
    const dayStart = 7; // 7:00
    const dayEnd = 21; // 21:00
    const totalMinutes = (dayEnd - dayStart)*60;

    // Sample events: all people have events on Monday that sometimes overlap
    const sampleEvents = [
      {person:0, day:0, start:'08:00', end:'09:30', title:'Scrum & Planning'},
      {person:0, day:0, start:'11:00', end:'12:00', title:'1:1 with Dana'},
      {person:0, day:0, start:'13:00', end:'15:00', title:'Design review'},

      {person:1, day:0, start:'08:15', end:'09:00', title:'Emails & Triage'},
      {person:1, day:0, start:'10:30', end:'12:30', title:'Client call'},
      {person:1, day:0, start:'14:30', end:'16:00', title:'Prototype tweak'},

      {person:2, day:0, start:'09:00', end:'10:30', title:'Code pairing'},
      {person:2, day:0, start:'11:30', end:'13:00', title:'Database migration'},
      {person:2, day:0, start:'15:00', end:'17:30', title:'Ops support'},

      {person:3, day:0, start:'07:30', end:'08:45', title:'Morning jog'},
      {person:3, day:0, start:'09:30', end:'11:30', title:'Stakeholder sync'},
      {person:3, day:0, start:'13:30', end:'14:30', title:'Hiring interviews'},

      {person:4, day:0, start:'08:45', end:'09:15', title:'Coffee & quick chat'},
      {person:4, day:0, start:'10:00', end:'11:00', title:'Prototype feedback'},
      {person:4, day:0, start:'12:30', end:'14:00', title:'Lunch + docs'},

      {person:5, day:0, start:'09:15', end:'10:00', title:'Design QA'},
      {person:5, day:0, start:'11:00', end:'12:00', title:'Product review'},
      {person:5, day:0, start:'15:30', end:'16:30', title:'Wrap-up'},

      {person:6, day:0, start:'08:00', end:'08:30', title:'Onboarding call'},
      {person:6, day:0, start:'09:45', end:'11:15', title:'Architecture talk'},
      {person:6, day:0, start:'13:00', end:'14:00', title:'Town hall'}
    ];

    // helper: convert HH:MM to minutes since midnight
    function toMins(t){const [hh,mm]=t.split(':').map(Number);return hh*60+mm}

    // Build time column labels
    const timeCol = document.getElementById('time-column');
    for(let h=dayStart; h<=dayEnd; h++){
      const label = document.createElement('div');
      label.className='time-label';
      const hour = (h%12===0?12:h%12);
      label.textContent = hour + ':00 ' + (h<12?'AM':'PM');
      label.style.height = getComputedStyle(document.documentElement).getPropertyValue('--hour-height') || '80px';
      timeCol.appendChild(label);
    }

    // Legend
    const legend = document.getElementById('legend');
    people.forEach(p=>{
      const chip = document.createElement('div');chip.className='person-chip';
      const dot = document.createElement('div');dot.className='dot p'+(p.id%7);
      const name = document.createElement('div');name.textContent = p.name;
      chip.appendChild(dot);chip.appendChild(name);legend.appendChild(chip);
    });

    // Week grid
    const week = document.getElementById('week');
    days.forEach((d,di)=>{
      const dayEl = document.createElement('div');dayEl.className='day';
      const today = new Date();
      dayEl.innerHTML = `<div class="day-header"><div><div class="day-name">${d}</div><div class="day-sub">${today.toLocaleDateString()}</div></div></div><div class="day-body" data-day="${di}"></div>`;
      week.appendChild(dayEl);

      // draw hour lines
      const dayBody = dayEl.querySelector('.day-body');
      for(let h=dayStart; h<=dayEnd; h++){
        const yPercent = ((h - dayStart)/ (dayEnd-dayStart))*100;
        const line = document.createElement('div');line.className='hour-line';
        line.style.top = `calc(${yPercent}% - 0.5px)`;
        const lbl = document.createElement('div');lbl.className='label';lbl.textContent = (h%12===0?12:h%12)+':00';
        line.appendChild(lbl);
        dayBody.appendChild(line);
      }

      // tracks container (grid with 7 equal rows)
      const tracks = document.createElement('div');tracks.className='tracks';
      people.forEach(p=>{
        const track = document.createElement('div');track.className='track';track.dataset.person = p.id;tracks.appendChild(track);
      });
      dayBody.appendChild(tracks);
    });

    // Render events
    function renderEvents(){
      // clear existing
      document.querySelectorAll('.event').forEach(e=>e.remove());
      // Sort events by start so stacking z-order is stable
      sampleEvents.slice().sort((a,b)=>{
        const sa = toMins(a.start), sb = toMins(b.start);
        return sa - sb;
      }).forEach((ev, idx)=>{
        const dayIdx = ev.day;
        const dayBody = document.querySelector(`.day-body[data-day='${dayIdx}']`);
        if(!dayBody) return;
        const tracks = dayBody.querySelectorAll('.track');
        const track = tracks[ev.person];
        if(!track) return;

        const eDiv = document.createElement('div'); 
        eDiv.className = `event p${ev.person%7}`;
        // small visual offset class to make overlapping look interleaved
        if (idx % 3 === 1) eDiv.classList.add('offset-1');
        if (idx % 3 === 2) eDiv.classList.add('offset-2');
        eDiv.innerHTML = `<div class="meta">${ev.title}</div><div style="font-size:12px;opacity:0.95">${ev.start} — ${ev.end}</div>`;

        // compute position
        const startM = toMins(ev.start);
        const endM = toMins(ev.end);
        const topMin = Math.max(0, startM - dayStart*60);
        const durMin = Math.max(10, endM - startM);
        const topPercent = (topMin/totalMinutes)*100;
        const heightPercent = (durMin/totalMinutes)*100;
        // apply percent positions relative to the track (which is a fraction of day-body)
        eDiv.style.top = `${topPercent}%`;
        eDiv.style.height = `${heightPercent}%`;

        // left/right stable inset (no risky calc)
        eDiv.style.left = '6px';
        eDiv.style.right = '6px';

        track.appendChild(eDiv);
      });
    }

    renderEvents();
  </script>
</body>
</html>
