{% extends "base.html" %}

{% block title %}Calendar View{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
<script src="{{ url_for('static', filename='js/calendar.js') }}" defer></script>
{% endblock %}

{% block content %}

<div class="container" role="application" aria-label="Weekly availability prototype">
    <div class="header">
      <div>
        <div class="title">Weekly Availability — hover a column</div>
        <div class="subtitle">Vertical gradient = how many people are busy at that minute</div>
      </div>
      <div class="legend" aria-hidden="true">
        <div class="swatch"></div>
        <div class="muted">more busy →</div>
      </div>
    </div>

    <div class="week">
      <div class="time-column" id="time-column"></div>
      <div class="days" id="days"></div>
    </div>
  </div>

  <div id="tooltip" class="tooltip" role="dialog" aria-hidden="true">
    <span class="time" id="tooltip-time">08:00</span>
    <div id="tooltip-list"><span class="muted">No one in class</span></div>
  </div>

<script>
  // Initialize with data from Flask
  const people = {{ people | tojson }};
  const events = {{ events | tojson }};
  // Assuming the JS has a way to set data
  if (window.CalendarPrototype) {
    window.CalendarPrototype.redraw(events, people);
  }
</script>
{% endblock %}
